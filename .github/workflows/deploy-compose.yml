name: Deployment Compose Contract

on:
  push:
    paths:
      - '.github/workflows/deploy-compose.yml'
      - 'Dockerfile'
      - 'Makefile'
      - 'README.md'
      - 'deploy/README.md'
      - 'deploy/DOCKER.md'
      - 'deploy/config.example.yaml'
      - 'deploy/.env.example'
      - 'deploy/compose*.yaml'
      - 'deploy/test-compose-config.sh'
      - 'deploy/test-deploy-references.sh'
      - 'deploy/docker-deploy.sh'
      - 'deploy/test-docker-deploy.sh'
      - 'deploy/install.sh'
      - 'deploy/sub2api.service'
      - 'deploy/test-install-contract.sh'
  pull_request:
    paths:
      - '.github/workflows/deploy-compose.yml'
      - 'Dockerfile'
      - 'Makefile'
      - 'README.md'
      - 'deploy/README.md'
      - 'deploy/DOCKER.md'
      - 'deploy/config.example.yaml'
      - 'deploy/.env.example'
      - 'deploy/compose*.yaml'
      - 'deploy/test-compose-config.sh'
      - 'deploy/test-deploy-references.sh'
      - 'deploy/docker-deploy.sh'
      - 'deploy/test-docker-deploy.sh'
      - 'deploy/install.sh'
      - 'deploy/sub2api.service'
      - 'deploy/test-install-contract.sh'
  workflow_dispatch:

permissions:
  contents: read

env:
  COMPOSE_VERSION: 2.35.0
  COMPOSE_SHA256: dba1915cf2f282527f5df0cd7a94b9503047ed200317801853abe8f22c8cd493

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install pinned PyYAML
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Install pinned Docker Compose
        run: |
          install -d "$HOME/.docker/cli-plugins"
          curl --fail --silent --show-error --location \
            "https://github.com/docker/compose/releases/download/v${COMPOSE_VERSION}/docker-compose-linux-x86_64" \
            --output "$HOME/.docker/cli-plugins/docker-compose"
          printf '%s  %s\n' "$COMPOSE_SHA256" "$HOME/.docker/cli-plugins/docker-compose" | sha256sum --check
          chmod +x "$HOME/.docker/cli-plugins/docker-compose"
          test "$(docker compose version --short)" = "$COMPOSE_VERSION"
      - name: Validate deployment Compose contract
        run: make test-compose
